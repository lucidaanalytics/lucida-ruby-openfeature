name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_RUBYGEMS: ${{ secrets.RUBYGEMS_API_KEY != '' }}
    permissions:
      contents: write
      id-token: write # attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
      - run: gem build *.gemspec
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.gem"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.gem --generate-notes --verify-tag
      # RubyGems publish runs only when the RUBYGEMS_API_KEY repository secret is set.
      - name: Publish to RubyGems
        if: env.HAS_RUBYGEMS == 'true'
        run: gem push *.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
